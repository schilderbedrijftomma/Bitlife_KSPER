<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Life Simulator</title>
  <style>
    :root {
      --bg-dark: #121e2b;
      --card-bg: #1e2d3d;
      --accent-red: #e11d48;
      --accent-orange: #f97316;
      --accent-green: #22c55e;
      --accent-blue: #0284c7;
      --accent-yellow: #facc15;
      --text-main: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b131d; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

    .game-container {
      width: 100%;
      max-width: 450px;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #ef4444, #f97316);
      padding: 12px;
      text-align: center;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 1px;
    }

    #creator-screen {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      height: 100%;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.9rem; color: #94a3b8; font-weight: bold; }
    .form-group input, .form-group select {
      background-color: var(--card-bg);
      border: 1px solid #2a3c50;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
    }

    .avatar-preview {
      font-size: 4rem;
      text-align: center;
      margin: 10px 0;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #2a3c50;
    }

    .start-btn {
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 15px;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 10px;
      cursor: pointer;
    }

    #game-screen { display: none; flex-direction: column; height: 100%; }

    .profile-bar {
      background-color: #0d1722;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2a3c50;
    }

    .profile-info { display: flex; align-items: center; gap: 12px; }
    .avatar { font-size: 2.2rem; }
    .money { color: var(--accent-green); font-weight: bold; font-size: 1.2rem; }

    .main-content {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .log-box {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      font-size: 0.95rem;
      line-height: 1.6;
      max-height: 380px;
      overflow-y: auto;
      border: 1px solid #2a3c50;
    }

    .log-age-header {
      color: var(--accent-yellow);
      font-weight: bold;
      font-size: 1.15rem;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    .log-age-header:first-child { margin-top: 0; }
    .log-entry { color: #f1f5f9; margin-bottom: 4px; }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .panel-header {
      background: linear-gradient(90deg, #f97316, #ef4444);
      padding: 10px;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .sub-section-header {
      font-size: 0.9rem;
      color: #f97316;
      margin: 12px 0 6px 0;
      font-weight: bold;
      text-transform: uppercase;
    }

    .list-item {
      background-color: var(--card-bg);
      padding: 12px 15px;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid #2a3c50;
    }
    .list-item:hover { background-color: #2a3c50; }
    .disabled { opacity: 0.4; cursor: not-allowed; }

    .rel-bar {
      width: 80px;
      height: 10px;
      background-color: #0d1722;
      border-radius: 5px;
      overflow: hidden;
    }
    .rel-fill { height: 100%; background-color: var(--accent-green); }

    .navbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #0d1722;
      padding: 10px 5px;
      border-top: 2px solid #2a3c50;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      cursor: pointer;
      gap: 4px;
      flex: 1;
    }
    .nav-btn.active { color: var(--accent-orange); font-weight: bold; }
    .nav-btn .icon { font-size: 1.5rem; }

    .age-btn {
      background: var(--accent-green);
      color: white;
      border: 4px solid var(--bg-dark);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      transform: translateY(-10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stats-container {
      background-color: #0d1722;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 2px solid #2a3c50;
    }

    .stat-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; }
    .stat-bar { flex: 1; height: 10px; background-color: #1e2d3d; border-radius: 5px; overflow: hidden; }
    .stat-fill { height: 100%; background-color: var(--accent-green); transition: width 0.3s; }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background-color: #ffffff;
      color: #1e293b;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      border: 6px solid #ef4444;
      overflow: hidden;
      text-align: center;
    }

    .modal-header { background-color: #ef4444; color: white; font-size: 1.3rem; font-weight: 900; padding: 10px; }
    .modal-body { padding: 15px; }
    .modal-options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .option-btn {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .option-btn.close { background-color: #64748b; }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">E-LIFE SIMULATOR</div>

  <div id="creator-screen">
    <h2 style="text-align: center; color: var(--accent-orange);">Create New Life</h2>
    <div class="avatar-preview" id="custom-avatar-preview">👶</div>

    <div class="form-group">
      <label>First Name:</label>
      <input type="text" id="input-firstname" value="Felix">
    </div>
    <div class="form-group">
      <label>Last Name:</label>
      <input type="text" id="input-lastname" value="Moore">
    </div>
    <div class="form-group">
      <label>Gender:</label>
      <select id="input-gender" onchange="updateAvatarPreview()">
        <option value="male">Male 👦</option>
        <option value="female">Female 👧</option>
      </select>
    </div>
    <div class="form-group">
      <label>Skin Tone:</label>
      <select id="input-skin" onchange="updateAvatarPreview()">
        <option value="👶">Light 👶</option>
        <option value="👶🏻">Fair 👶🏻</option>
        <option value="👶🏼">Medium 👶🏼</option>
        <option value="👶🏽">Olive 👶🏽</option>
        <option value="👶🏾">Dark 👶🏾</option>
      </select>
    </div>
    <div class="form-group">
      <label>Country:</label>
      <select id="input-country"></select>
    </div>

    <button class="start-btn" onclick="startGame()">Start Life 🚀</button>
  </div>

  <div id="game-screen">
    <div class="profile-bar">
      <div class="profile-info">
        <span class="avatar" id="avatar">👶</span>
        <div>
          <div id="char-name" style="font-weight: bold;">-</div>
          <div id="char-status" style="font-size: 0.8rem; color: #94a3b8;">Infant</div>
        </div>
      </div>
      <div class="money" id="money-display">$0</div>
    </div>

    <div class="main-content">
      <div id="view-main" class="view-panel active">
        <div class="log-box" id="log-box"></div>
      </div>

      <div id="view-relationships" class="view-panel">
        <div class="panel-header">RELATIONSHIPS</div>
        <div id="family-list"></div>
      </div>

      <div id="view-activities" class="view-panel">
        <div class="panel-header">ACTIVITIES</div>
        <div id="activities-list"></div>
      </div>

      <div id="view-assets" class="view-panel">
        <div class="panel-header">ASSETS & PROPERTY</div>
        <div class="sub-section-header">📦 My Belongings</div>
        <div id="owned-assets-list"></div>
        <div class="sub-section-header">🛍️ Shopping Center</div>
        <div id="assets-shop-list"></div>
      </div>
    </div>

    <div class="navbar">
      <button class="nav-btn active" id="nav-btn-main" onclick="switchTab('main', this)">
        <span class="icon">📜</span>Log
      </button>
      <button class="nav-btn" onclick="switchTab('assets', this)">
        <span class="icon">🏠</span>Assets
      </button>
      
      <button class="age-btn" onclick="ageUp()">
        <span style="font-size: 1.2rem;">+</span>
        <span style="font-size: 0.65rem;">Age</span>
      </button>

      <button class="nav-btn" onclick="switchTab('relationships', this)">
        <span class="icon">❤️</span>Rel.
      </button>
      <button class="nav-btn" onclick="switchTab('activities', this)">
        <span class="icon">💬</span>Actions
      </button>
    </div>

    <div class="stats-container">
      <div class="stat-row"><span>Happiness 😄</span><div class="stat-bar"><div class="stat-fill" id="stat-happy"></div></div></div>
      <div class="stat-row"><span>Health ❤️</span><div class="stat-bar"><div class="stat-fill" id="stat-health"></div></div></div>
      <div class="stat-row"><span>Smarts 💡</span><div class="stat-bar"><div class="stat-fill" id="stat-smart"></div></div></div>
      <div class="stat-row"><span>Looks 🌤️</span><div class="stat-bar"><div class="stat-fill" id="stat-looks"></div></div></div>
    </div>
  </div>

  <div class="modal-overlay" id="event-modal">
    <div class="modal-card">
      <div class="modal-header" id="modal-header-title">Event</div>
      <div class="modal-body">
        <div style="font-size: 2.5rem;" id="modal-icon">👦</div>
        <div style="font-size: 1.1rem; font-weight: bold; margin: 8px 0;" id="modal-title">Title</div>
        <div style="font-size: 0.9rem; color: #475569;" id="modal-desc">Description</div>
        <div class="modal-options" id="modal-options"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const countries = ["United States", "United Kingdom", "Netherlands", "Canada", "Australia", "Germany", "France", "Japan", "Brazil"];
  const yearlyEvents = [
    "You spent a peaceful year with your family.",
    "You learned something new and felt inspired.",
    "You enjoyed watching your favorite shows.",
    "You tried a new dish that tasted amazing.",
    "You made a new friend in your neighborhood."
  ];

  const availableAssetsList = [
    { id: 'toy', name: "Action Figure", price: 50, req: 3, icon: "🧸" },
    { id: 'console', name: "Gaming Console", price: 500, req: 10, icon: "🎮" },
    { id: 'phone', name: "Smartphone", price: 1200, req: 12, icon: "📱" },
    { id: 'pc', name: "Gaming PC", price: 3000, req: 14, icon: "🖥️" },
    { id: 'car', name: "Used Car", price: 6000, req: 18, icon: "🚗" },
    { id: 'house', name: "Cozy Apartment", price: 180000, req: 18, icon: "🏢" }
  ];

  const countrySelect = document.getElementById('input-country');
  countries.forEach(c => {
    const opt = document.createElement('option');
    opt.value = opt.innerText = c;
    countrySelect.appendChild(opt);
  });

  function updateAvatarPreview() {
    document.getElementById('custom-avatar-preview').innerText = document.getElementById('input-skin').value;
  }

  let player = {};

  function startGame() {
    player = {
      firstName: document.getElementById('input-firstname').value || "Felix",
      lastName: document.getElementById('input-lastname').value || "Moore",
      gender: document.getElementById('input-gender').value,
      skin: document.getElementById('input-skin').value,
      country: document.getElementById('input-country').value,
      age: 0,
      money: 0,
      job: "Infant",
      salary: 0,
      isDead: false,
      stats: { happy: 80, health: 95, smart: 60, looks: 50 },
      family: [
        { name: `John ${document.getElementById('input-lastname').value}`, role: "Father", age: 30, rel: 90, icon: "👨" },
        { name: `Mary ${document.getElementById('input-lastname').value}`, role: "Mother", age: 28, rel: 95, icon: "👩" }
      ],
      inventory: []
    };

    document.getElementById('creator-screen').style.display = "none";
    document.getElementById('game-screen').style.display = "flex";
    document.getElementById('log-box').innerHTML = "";
    document.getElementById('char-name').innerText = `${player.firstName} ${player.lastName}`;

    addLog(`You were born in <b>${player.country}</b>.`);
    updateUI();
  }

  function updateUI() {
    document.getElementById('money-display').innerText = `$${player.money.toLocaleString()}`;
    document.getElementById('avatar').innerText = player.isDead ? "🪦" : (player.age < 3 ? player.skin : (player.gender === "male" ? "👨" : "👩"));

    if(!player.isDead) {
      if(player.age < 3) player.job = "Infant";
      else if(player.age < 18) player.job = "Student 📚";
      else if(player.job === "Student 📚" || player.job === "Infant") player.job = "Unemployed";
    }
    
    document.getElementById('char-status').innerText = player.job;

    ['happy', 'health', 'smart', 'looks'].forEach(s => {
      document.getElementById(`stat-${s}`).style.width = Math.max(0, Math.min(100, player.stats[s])) + '%';
    });

    renderFamily();
    renderActivities();
    renderAssets();
  }

  function addLog(text) {
    const logBox = document.getElementById('log-box');
    const ageHeaderId = `log-age-group-${player.age}`;
    let group = document.getElementById(ageHeaderId);

    if (!group) {
      group = document.createElement('div');
      group.id = ageHeaderId;
      group.innerHTML = `<div class="log-age-header">Age: ${player.age} years</div>`;
      logBox.insertBefore(group, logBox.firstChild);
    }

    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = text;
    group.appendChild(entry);
  }

  function goToLogTab() {
    switchTab('main', document.getElementById('nav-btn-main'));
  }

  function ageUp() {
    if(player.isDead) return;
    goToLogTab();

    player.age++;
    player.family.forEach(f => f.age++);

    if(player.stats.health <= 0 || player.age >= 100) {
      player.isDead = true;
      addLog("You have passed away.");
      updateUI();
      return;
    }

    addLog(yearlyEvents[Math.floor(Math.random() * yearlyEvents.length)]);
    if (player.salary > 0) {
      player.money += player.salary;
      addLog(`Salary received: +$${player.salary.toLocaleString()}`);
    }
    updateUI();
  }

  function switchTab(tabName, btn) {
    document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`view-${tabName}`).classList.add('active');
    btn.classList.add('active');
  }

  function renderFamily() {
    const container = document.getElementById('family-list');
    container.innerHTML = player.family.map(f => `
      <div class="list-item">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:1.5rem">${f.icon}</span>
          <div><b>${f.name}</b> (${f.role})<div style="font-size:0.75rem; color:#94a3b8">Age: ${f.age}</div></div>
        </div>
        <div class="rel-bar"><div class="rel-fill" style="width: ${f.rel}%;"></div></div>
      </div>
    `).join('');
  }

  function renderActivities() {
    const container = document.getElementById('activities-list');
    const acts = [
      { name: "🩺 Visit Doctor", icon: "👨‍⚕️", req: 0, action: () => { player.stats.health = 100; addLog("Doctor cured all ailments!"); goToLogTab(); } },
      { name: "🏋️ Gym", icon: "💪", req: 12, action: () => { player.stats.health = Math.min(100, player.stats.health + 10); addLog("Worked out at the gym!"); goToLogTab(); } },
      { name: "🎓 University", icon: "🏫", req: 18, action: () => { player.job = "Engineer"; player.salary = 75000; addLog("Graduated University as an Engineer!"); goToLogTab(); } }
    ];

    container.innerHTML = acts.map((act, i) => {
      const isLocked = player.age < act.req || player.isDead;
      return `
        <div class="list-item ${isLocked ? 'disabled' : ''}" onclick="${!isLocked ? `runAct(${i})` : ''}">
          <span>${act.icon} <b>${act.name}</b></span>
          <span>${isLocked ? `Age ${act.req}+` : '➡️'}</span>
        </div>
      `;
    }).join('');

    window.runAct = (i) => { acts[i].action(); updateUI(); };
  }

  function renderAssets() {
    const shopContainer = document.getElementById('assets-shop-list');
    shopContainer.innerHTML = availableAssetsList.map((item, i) => {
      const isLocked = player.age < item.req || player.isDead;
      return `
        <div class="list-item ${isLocked ? 'disabled' : ''}" onclick="${!isLocked ? `buyAsset(${i})` : ''}">
          <span>${item.icon} <b>${item.name}</b></span>
          <span style="color:var(--accent-green)">$${item.price.toLocaleString()}</span>
        </div>
      `;
    }).join('');

    window.buyAsset = (i) => {
      const item = availableAssetsList[i];
      if(player.money >= item.price) {
        player.money -= item.price;
        player.inventory.push(item);
        addLog(`Bought ${item.name}!`);
        goToLogTab();
        updateUI();
      } else { alert("Not enough money!"); }
    };
  }
</script>
</body>
</html>
