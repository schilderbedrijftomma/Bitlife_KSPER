<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitLife Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b1426; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container {
            width: 100%; max-width: 500px; background-color: #121f38;
            display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden;
        }

        /* HEADER */
        .header { background: #1a2b4c; padding: 15px; border-bottom: 2px solid #23375e; text-align: center; position: relative; }
        .char-title { font-size: 20px; font-weight: bold; color: #4aa3df; }
        .char-subtitle { font-size: 13px; color: #a0b2d6; margin-top: 2px; }
        .bank-balance { position: absolute; right: 15px; top: 15px; color: #2ecc71; font-weight: bold; font-size: 18px; }

        /* CREATION SCREEN */
        .setup-screen { padding: 30px 20px; text-align: center; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; }
        .setup-screen h1 { color: #f39c12; font-size: 28px; }
        .setup-screen input, .setup-screen select { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #283e6b; background: #1b2c4e; color: white; font-size: 16px; }
        .btn-start { background: #2ecc71; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start:hover { background: #27ae60; }

        /* EVENT LOG */
        .log-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 8px; font-size: 14px; background: #0c1628; }
        .log-item { background: #16243f; padding: 10px 12px; border-radius: 6px; border-left: 4px solid #3498db; line-height: 1.4; }
        .log-item b { color: #f1c40f; }

        /* STATS BARS */
        .stats-container { background: #16243f; padding: 12px 15px; border-top: 1px solid #23375e; }
        .stat-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; font-weight: bold; }
        .stat-name { width: 80px; }
        .stat-bar-bg { flex: 1; background: #0b1426; height: 12px; border-radius: 6px; overflow: hidden; margin: 0 8px; }
        .stat-bar-fill { height: 100%; background: #2ecc71; transition: width 0.3s; }
        .stat-val { width: 35px; text-align: right; }

        /* ACTION MENU BOTTOM */
        .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); background: #1a2b4c; border-top: 2px solid #23375e; position: relative; height: 70px; }
        .nav-btn { background: none; border: none; color: white; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; gap: 4px; }
        .nav-btn .icon { font-size: 18px; }
        .age-circle {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; border-radius: 50%; background: #2ecc71;
            border: 4px solid #121f38; color: white; font-weight: bold; font-size: 24px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .age-circle:active { transform: translateX(-50%) scale(0.95); }

        /* MODAL / SUBMENUS */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 20, 38, 0.96); display: none; flex-direction: column; z-index: 100; }
        .modal-header { background: #1a2b4c; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #23375e; }
        .modal-body { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .menu-card { background: #1b2c4e; padding: 14px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: 1px solid #283e6b; }
        .menu-card:hover { background: #23375e; }
        .close-btn { background: #e74c3c; border: none; color: white; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="setup-screen" class="setup-screen">
        <h1>BitLife Online 👑</h1>
        <input type="text" id="p-name" placeholder="Imię" value="Adam">
        <input type="text" id="p-surname" placeholder="Nazwisko" value="Nowak">
        <select id="p-country">
            <option value="Polska">🇵🇱 Polska</option>
            <option value="USA">🇺🇸 USA</option>
            <option value="Wielka Brytania">🇬🇧 Wielka Brytania</option>
            <option value="Niemcy">🇩🇪 Niemcy</option>
            <option value="Japonia">🇯🇵 Japonia</option>
        </select>
        <button class="btn-start" onclick="initGame()">Rozpocznij Życie ✨</button>
    </div>

    <div id="game-screen" style="display:none; flex-direction:column; height:100%;">
        <div class="header">
            <div class="char-title" id="ui-name">Adam Nowak</div>
            <div class="char-subtitle" id="ui-status">Wiek: 0 | Niemowlę</div>
            <div class="bank-balance" id="ui-money">$0</div>
        </div>

        <div class="log-container" id="log-box"></div>

        <div class="stats-container">
            <div class="stat-row"><span class="stat-name">Szczęście</span><div class="stat-bar-bg"><div id="bar-happy" class="stat-bar-fill"></div></div><span id="val-happy" class="stat-val">0%</span></div>
            <div class="stat-row"><span class="stat-name">Zdrowie</span><div class="stat-bar-bg"><div id="bar-health" class="stat-bar-fill"></div></div><span id="val-health" class="stat-val">0%</span></div>
            <div class="stat-row"><span class="stat-name">Mądrość</span><div class="stat-bar-bg"><div id="bar-smarts" class="stat-bar-fill"></div></div><span id="val-smarts" class="stat-val">0%</span></div>
            <div class="stat-row"><span class="stat-name">Wygląd</span><div class="stat-bar-bg"><div id="bar-looks" class="stat-bar-fill"></div></div><span id="val-looks" class="stat-val">0%</span></div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" onclick="openModal('school-job')"><span class="icon">💼</span>Edukacja/Praca</button>
            <button class="nav-btn" onclick="openModal('rel')"><span class="icon">👨‍👩‍👦</span>Relacje</button>
            <div class="age-circle" onclick="ageUp()">+</div>
            <button class="nav-btn" onclick="openModal('social')"><span class="icon">📱</span>Social Media</button>
            <button class="nav-btn" onclick="openModal('activities')"><span class="icon">⚽</span>Aktywności</button>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-header">
            <h3 id="modal-title">Menu</h3>
            <button class="close-btn" onclick="closeModal()">Zamknij X</button>
        </div>
        <div class="modal-body" id="modal-content"></div>
    </div>
</div>

<script>
    let player = {
        name: "", surname: "", age: 0, money: 0, country: "Polska",
        stats: { happy: 80, health: 90, smarts: 50, looks: 60 },
        education: "Brak", job: "Bezrobotny", salary: 0,
        socials: { youtube: 0, tiktok: 0, twitch: 0, instagram: 0 },
        sportsClub: "Brak", pets: [],
        family: { father: "", mother: "", sibling: "" }
    };

    const firstNamesMale = ["Jan", "Adam", "Piotr", "Michał", "Kamil", "Mateusz", "Kacper", "Jakub"];
    const firstNamesFemale = ["Anna", "Maria", "Katarzyna", "Ewa", "Karolina", "Wiktoria", "Julia", "Zofia"];
    const petTypes = ["Pies", "Kot", "Chomik", "Papuga", "Wąż", "Jaszczurka"];

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function initGame() {
        player.name = document.getElementById('p-name').value || "Adam";
        player.surname = document.getElementById('p-surname').value || "Nowak";
        player.country = document.getElementById('p-country').value;
        
        player.stats.happy = rand(50, 100);
        player.stats.health = rand(60, 100);
        player.stats.smarts = rand(20, 95);
        player.stats.looks = rand(20, 90);

        player.family.father = `${firstNamesMale[rand(0, firstNamesMale.length-1)]} ${player.surname} (Wiek: ${rand(22, 45)})`;
        player.family.mother = `${firstNamesFemale[rand(0, firstNamesFemale.length-1)]} ${player.surname} (Wiek: ${rand(20, 42)})`;

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';

        addLog(`Urodziłeś się jako <b>${player.name} ${player.surname}</b> w kraju: ${player.country}!`);
        addLog(`👨‍👩‍👦 Ojciec: ${player.family.father} | Matka: ${player.family.mother}`);
        updateUI();
    }

    function updateUI() {
        document.getElementById('ui-name').innerText = `${player.name} ${player.surname}`;
        document.getElementById('ui-status').innerText = `Wiek: ${player.age} | ${player.job !== 'Bezrobotny' ? player.job : player.education}`;
        document.getElementById('ui-money').innerText = `$${player.money}`;

        for (let s in player.stats) {
            document.getElementById(`bar-${s}`).style.width = player.stats[s] + '%';
            document.getElementById(`val-${s}`).innerText = player.stats[s] + '%';
        }
    }

    function addLog(msg) {
        const logBox = document.getElementById('log-box');
        logBox.innerHTML += `<div class="log-item"><b>[Wiek ${player.age}]</b> ${msg}</div>`;
    }

    function ageUp() {
        player.age++;
        
        // Zdarzenia Edukacyjne
        if (player.age === 7) { player.education = "Uczeń Szkoły Podstawowej"; addLog("🎒 Rozpoczynasz naukę w Szkołe Podstawowej!"); }
        if (player.age === 15) { player.education = "Uczeń Liceum"; addLog("🏫 Awansowałeś do Liceum!"); }
        if (player.age === 19 && player.education !== "Wykształcony") { player.education = "Student Uniwersytetu"; addLog("🎓 Dostałeś się na Uniwersytet!"); }
        if (player.age === 24 && player.education === "Student Uniwersytetu") { player.education = "Wykształcony Wyższe"; addLog("👨‍🎓 Ukończyłeś Uniwersytet!"); }

        // Wynagrodzenie z pracy
        if (player.job !== "Bezrobotny") {
            player.money += player.salary;
            addLog(`💰 Otrzymałeś roczną pensję (${player.job}): +$${player.salary}`);
        }

        // Wydatki na zwierzęta
        if (player.pets.length > 0) {
            let petCost = player.pets.length * 150;
            player.money = Math.max(0, player.money - petCost);
            addLog(`🐾 Wydałeś $${petCost} na utrzymanie swoich zwierząt.`);
        }

        // Losowa szansa na wydarzenie roczne
        triggerRandomYearEvent();

        updateUI();
    }

    function triggerRandomYearEvent() {
        let r = Math.random();
        if (r < 0.15) {
            let found = rand(15, 300);
            player.money += found;
            addLog(`💵 Znalazłeś zagubione pieniądze na ulicy: +$${found}!`);
        } else if (r < 0.25) {
            player.stats.health = Math.max(0, player.stats.health - rand(5, 20));
            addLog(`🤒 Zachorowałeś na grypę! Twoje zdrowie spadło.`);
        } else if (r < 0.35 && player.age > 12) {
            let viralFollowers = rand(200, 3000);
            player.socials.tiktok += viralFollowers;
            addLog(`🔥 Twój stary film stał się viralem! Zyskałeś +${viralFollowers} obserwujących na TikToku.`);
        } else if (r < 0.42 && player.age > 18) {
            addLog(`🎟️ Kupujesz los na loterii... niestety nic nie wygrałeś.`);
        }
    }

    /* MODAL GENERATOR */
    function openModal(type) {
        const modal = document.getElementById('modal');
        const title = document.getElementById('modal-title');
        const content = document.getElementById('modal-content');
        content.innerHTML = "";
        modal.style.display = "flex";

        if (type === 'social') {
            title.innerText = "📱 Social Media";
            content.innerHTML = `
                <div class="menu-card" onclick="openSubSocial('youtube')"><span>▶️ YouTube</span> <span>${player.socials.youtube} subów</span></div>
                <div class="menu-card" onclick="openSubSocial('tiktok')"><span>🎵 TikTok</span> <span>${player.socials.tiktok} obserowacji</span></div>
                <div class="menu-card" onclick="openSubSocial('twitch')"><span>🟪 Twitch</span> <span>${player.socials.twitch} widzów</span></div>
                <div class="menu-card" onclick="openSubSocial('instagram')"><span>📸 Instagram</span> <span>${player.socials.instagram} obserwujących</span></div>
            `;
        } else if (type === 'activities') {
            title.innerText = "⚽ Aktywności & Hobby";
            content.innerHTML = `
                <div class="menu-card" onclick="openSportsMenu()"><span>🏆 Dołącz do klubu sportowego</span></div>
                <div class="menu-card" onclick="goGym()"><span>🏋️ Trening na Siłowni (+Zdrowie/Wygląd)</span></div>
                <div class="menu-card" onclick="buyPetMenu()"><span>🐶 Sklep ze Zwierzętami</span></div>
                <div class="menu-card" onclick="playLottery()"><span>🎟️ Kup Los na Loterii ($10)</span></div>
            `;
        } else if (type === 'school-job') {
            title.innerText = "💼 Edukacja & Praca";
            content.innerHTML = `
                <div class="menu-card" onclick="studyHard()"><span>📚 Ucz się pilnie (+Mądrość)</span></div>
                <div class="menu-card" onclick="openGigsMenu()"><span>🔨 Prace Dorywcze (Dla młodych)</span></div>
                <div class="menu-card" onclick="openJobsMenu()"><span>💼 Szukaj Pełnoetatowej Pracy</span></div>
            `;
        } else if (type === 'rel') {
            title.innerText = "👨‍👩‍👦 Relacje";
            content.innerHTML = `
                <div class="menu-card" onclick="interactRel('Ojciec')"><span>👨 Ojciec: ${player.family.father}</span></div>
                <div class="menu-card" onclick="interactRel('Matka')"><span>👩 Matka: ${player.family.mother}</span></div>
            `;
        }
    }

    function closeModal() { document.getElementById('modal').style.display = "none"; }

    /* SOCIAL MEDIA SUB-MENU */
    function openSubSocial(platform) {
        if (player.age < 11) { alert("Jesteś za młody na Social Media!"); return; }
        const content = document.getElementById('modal-content');
        if (platform === 'youtube') {
            content.innerHTML = `
                <div class="menu-card" onclick="postSocial('youtube', 'vlog')"><span>📹 Nagraj Vloga</span></div>
                <div class="menu-card" onclick="postSocial('youtube', 'gaming')"><span>🎮 Nagraj Gameplay</span></div>
            `;
        } else if (platform === 'tiktok') {
            content.innerHTML = `
                <div class="menu-card" onclick="postSocial('tiktok', 'dance')"><span>💃 Nagraj Taniec</span></div>
                <div class="menu-card" onclick="postSocial('tiktok', 'comedy')"><span>😂 Nagraj Śmieszny Filmik</span></div>
            `;
        } else if (platform === 'twitch') {
            content.innerHTML = `
                <div class="menu-card" onclick="postSocial('twitch', 'stream')"><span>🔴 Odpal Stream na Żywo</span></div>
            `;
        } else if (platform === 'instagram') {
            content.innerHTML = `
                <div class="menu-card" onclick="postSocial('instagram', 'photo')"><span>📸 Wstaw Zdjęcie</span></div>
            `;
        }
    }

    function postSocial(platform, act) {
        let gained = rand(20, 400);
        if (platform === 'youtube') player.socials.youtube += gained;
        if (platform === 'tiktok') player.socials.tiktok += gained * 2;
        if (platform === 'twitch') player.socials.twitch += Math.floor(gained / 2);
        if (platform === 'instagram') player.socials.instagram += gained;

        player.stats.happy = Math.min(100, player.stats.happy + 2);
        addLog(`📱 Opublikowałeś treści na **${platform.toUpperCase()}**! Zyskałeś nowe zasięgi.`);
        updateUI();
        closeModal();
    }

    /* SPORTS MENU */
    function openSportsMenu() {
        const content = document.getElementById('modal-content');
        const sports = ["⚽ Piłka Nożna", "🏀 Koszykówka", "🏊 Pływanie", "🥋 Sztuki Walki", "🎾 Tenis", "Volleyball 🏐"];
        content.innerHTML = sports.map(s => `<div class="menu-card" onclick="joinSport('${s}')"><span>${s}</span></div>`).join('');
    }

    function joinSport(s) {
        player.sportsClub = s;
        player.stats.health = Math.min(100, player.stats.health + 10);
        addLog(`🏆 Dołączyłeś do sekcji **${s}**!`);
        updateUI();
        closeModal();
    }

    function goGym() {
        player.stats.health = Math.min(100, player.stats.health + 6);
        player.stats.looks = Math.min(100, player.stats.looks + 4);
        addLog(`🏋️ Wyciskałeś ciężary na siłowni! Zdrowie i Wygląd w górę.`);
        updateUI();
        closeModal();
    }

    /* PETS & LOTTERY */
    function buyPetMenu() {
        const content = document.getElementById('modal-content');
        content.innerHTML = petTypes.map(p => `<div class="menu-card" onclick="buyPet('${p}')"><span>Adoptuj: ${p} ($200)</span></div>`).join('');
    }

    function buyPet(pet) {
        if (player.money < 200) { alert("Nie masz wystarczająco pieniędzy!"); return; }
        player.money -= 200;
        player.pets.push(pet);
        player.stats.happy = Math.min(100, player.stats.happy + 15);
        addLog(`🐾 Kupiłeś nowego zwierzaka: **${pet}**!`);
        updateUI();
        closeModal();
    }

    function playLottery() {
        if (player.money < 10) { alert("Nie masz $10!"); return; }
        player.money -= 10;
        if (Math.random() < 0.02) {
            let win = 50000;
            player.money += win;
            player.stats.happy = 100;
            addLog(`🎉 WYGRAŁEŚ NA LOTERII! +$${win}!`);
        } else {
            addLog(`🎟️ Niestety, twój los był pusty.`);
        }
        updateUI();
        closeModal();
    }

    /* EDUKACJA I PRACA */
    function studyHard() {
        player.stats.smarts = Math.min(100, player.stats.smarts + 8);
        addLog(`📚 Nauka opłaca się! Mądrość wzrosła.`);
        updateUI();
        closeModal();
    }

    function openGigsMenu() {
        const content = document.getElementById('modal-content');
        content.innerHTML = `
            <div class="menu-card" onclick="doGig('Koszenie trawnika', 40)"><span>🌱 Koszenie trawnika ($40)</span></div>
            <div class="menu-card" onclick="doGig('Wyprowadzanie psa', 25)"><span>🐕 Wyprowadzanie psa ($25)</span></div>
            <div class="menu-card" onclick="doGig('Korepetycje', 60)"><span>✏️ Korepetycje ($60)</span></div>
        `;
    }

    function doGig(name, pay) {
        player.money += pay;
        addLog(`🔨 Wykonałeś pracę dorywczą: **${name}** i zarobiłeś +$${pay}.`);
        updateUI();
        closeModal();
    }

    function openJobsMenu() {
        if (player.age < 18) { alert("Musisz mieć min. 18 lat na pełny etat!"); return; }
        const content = document.getElementById('modal-content');
        const jobsList = [
            { title: "Młodszy Programista", salary: 12000 },
            { title: "Kucharz", salary: 8000 },
            { title: "Streamer / Twórca", salary: 15000 },
            { title: "Aktor Filmowy", salary: 35000 },
            { title: "Inżynier", salary: 18000 }
        ];
        content.innerHTML = jobsList.map(j => `<div class="menu-card" onclick="applyJob('${j.title}', ${j.salary})"><span>${j.title} (Rocznie: $${j.salary})</span></div>`).join('');
    }

    function applyJob(title, salary) {
        player.job = title;
        player.salary = salary;
        addLog(`💼 Dostałeś nową pracę jako **${title}**! Zarobki: $${salary}/rok.`);
        updateUI();
        closeModal();
    }

    function interactRel(who) {
        player.stats.happy = Math.min(100, player.stats.happy + 6);
        addLog(`💬 Spędziłeś super czas z osobą: ${who}. Szczęście wzrosło!`);
        updateUI();
        closeModal();
    }
</script>
</body>
</html>
